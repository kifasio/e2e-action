name: Kifas E2E Gate
description: Trigger a Kifas run and block until it completes. Exit code is the gate — 0 pass, 1 fail.
branding:
  icon: check-circle
  color: blue

inputs:
  api-key:
    description: Kifas API key (store as a secret).
    required: true
  target-url:
    description: URL of the deployed preview to test (e.g. the PR deploy URL).
    required: false
    default: ''
  app-artifact:
    description: >-
      Local file path to a built app artifact (e.g. an APK) to gate this PR
      on. Uploaded to Kifas over HTTPS before the run is triggered — a GitHub
      Actions artifact has no publicly fetchable URL, so the action sends the
      file itself rather than a link.
    required: false
    default: ''
  environment:
    description: Logical environment label forwarded to the run (e.g. staging, preview).
    required: false
    default: ''
  suite:
    description: >-
      Suite to run: its slug (`smoke`), `project/slug` (`web/smoke`), or its id.
      Defaults to the project's "All workflows" suite — every test you have.
    required: false
    default: ''
  params:
    description: >-
      Suite parameters, one `key=value` per line. `base_url` and `app_build_id`
      are filled from target-url / app-artifact; anything here wins over those.
    required: false
    default: ''
  api-base:
    description: Kifas API base URL.
    required: false
    default: https://api.kifas.io
  github-token:
    description: >-
      Token used to post the run link + result as a PR comment. Defaults to the
      workflow's GITHUB_TOKEN; the job needs `permissions: pull-requests: write`.
      Leave empty to skip PR comments (the run still gates via exit code).
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Run Kifas E2E gate
      shell: bash
      run: bash "${{ github.action_path }}/run.sh"
      env:
        KIFAS_API_KEY: ${{ inputs.api-key }}
        KIFAS_TARGET_URL: ${{ inputs.target-url }}
        KIFAS_APP_ARTIFACT: ${{ inputs.app-artifact }}
        KIFAS_ENVIRONMENT: ${{ inputs.environment }}
        KIFAS_SUITE: ${{ inputs.suite }}
        KIFAS_PARAMS: ${{ inputs.params }}
        KIFAS_API_BASE: ${{ inputs.api-base }}
        KIFAS_GITHUB_TOKEN: ${{ inputs.github-token }}
